services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailpilot
      POSTGRES_USER: mailpilot
      POSTGRES_PASSWORD: mailpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailpilot -d mailpilot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_LOGIN_ENABLED: "false"
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      UNSUBSCRIBE_SIGNING_KEY: ${UNSUBSCRIBE_SIGNING_KEY:-}
      POSTGRES_DATABASE_URL: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      DATABASE_URL: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      DATABASE_URL_UNPOOLED: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env before starting Compose}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_LOGIN_ENABLED: "false"
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      UNSUBSCRIBE_SIGNING_KEY: ${UNSUBSCRIBE_SIGNING_KEY:-}
      POSTGRES_DATABASE_URL: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      DATABASE_URL: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      DATABASE_URL_UNPOOLED: postgresql://mailpilot:mailpilot@postgres:5432/mailpilot?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env before starting Compose}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
